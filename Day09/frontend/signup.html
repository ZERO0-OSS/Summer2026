<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blog Generator - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <nav class="bg-blue-600 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">AI blog generator</h1>
            <div class="flex gap-6">
                <a href="#" class="text-white font-bold hover:underline">Log in</a>
                <a href="#" class="text-white font-bold hover:underline">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容区域 -->
    <main class="flex-grow container mx-auto mt-12 px-4">
        <!-- 注册卡片 -->
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
            <h2 class="text-xl font-semibold mb-6 text-center">Create Account</h2>

            <div class="space-y-5">
                <!-- Username -->
                <div>
                    <label class="block mb-2 font-medium text-gray-700">Username</label>
                    <input id="username" type="text"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Email -->
                <div>
                    <label class="block mb-2 font-medium text-gray-700">Email</label>
                    <input id="email" type="email"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Password -->
                <div>
                    <label class="block mb-2 font-medium text-gray-700">Password</label>
                    <input id="password" type="password"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Confirm Password 确认密码 -->
                <div>
                    <label class="block mb-2 font-medium text-gray-700">Confirm Password</label>
                    <input id="confirmPassword" type="password"
                           class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:border-blue-500">
                    <!-- 错误提示文本，默认隐藏 -->
                    <p id="tipText" class="mt-1 text-red-500 text-sm hidden">两次输入的密码不一致</p>
                </div>

                <!-- 注册按钮 -->
                <button id="signUpBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                    Sign Up
                </button>
            </div>
        </div>
    </main>

<script>
    // 获取DOM元素
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const tipText = document.getElementById('tipText');
    const signUpBtn = document.getElementById('signUpBtn');

    signUpBtn.addEventListener('click', function () {
        // 去除首尾空格
        const userNameVal = username.value.trim();
        const emailVal = email.value.trim();
        const pwdVal = password.value;
        const confirmPwdVal = confirmPassword.value;

        // 简单判空
        if (!userNameVal || !emailVal || !pwdVal || !confirmPwdVal) {
            alert("请填写完整所有信息");
            return;
        }

        // 判断两次密码是否一致
        if (pwdVal !== confirmPwdVal) {
            tipText.classList.remove('hidden');
            return;
        }

        // 密码一致，隐藏提示，注册成功
        tipText.classList.add('hidden');
        alert("注册成功！");
    })

    // 用户继续输入时自动隐藏错误提示，体验更好
    confirmPassword.addEventListener('input', function(){
        tipText.classList.add('hidden');
    })
</script>
</body>
</html>
