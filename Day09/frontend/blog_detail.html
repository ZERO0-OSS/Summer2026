<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blog Generator - Blog Post Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <!-- 顶部导航栏（和之前页面保持统一） -->
    <nav class="bg-blue-600 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">AI blog generator</h1>
            <div class="flex gap-6">
                <a href="#" class="text-white font-bold hover:underline">Log in</a>
                <a href="#" class="text-white font-bold hover:underline">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容区域 -->
    <main class="flex-grow container mx-auto mt-12 px-4">
        <h1 class="text-[clamp(1.75rem,3vw,2.25rem)] font-bold mb-6">Blog Post Details</h1>

        <!-- 详情卡片 -->
        <div class="max-w-3xl bg-white rounded-lg shadow p-8 border border-gray-200">
            <!-- Blog Post Title -->
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-2">Blog Post Title</h2>
                <p class="text-gray-500 text-lg">This is the content</p>
            </div>

            <!-- 分割线 -->
            <hr class="border-gray-200 my-5">

            <!-- Youtube Title -->
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-2">Youtube Title</h2>
                <p class="text-gray-500 text-lg">Title of the associated youtube video</p>
            </div>

            <!-- Youtube Link -->
            <div>
                <h2 class="text-xl font-bold mb-2">Youtube Link</h2>
                <a href="https://www.youtube.com" target="_blank" class="text-blue-600 text-lg hover:underline">
                    https://www.youtube.com
                </a>
            </div>
        </div>
    </main>
</body>
</html>
